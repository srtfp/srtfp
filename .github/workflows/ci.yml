name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # v4.33.0: the pin (lean-toolchain), and the floor — the spec and
        #   `Srtfp/Proofs/Model.lean` need core's `Float.Model`. Consumers on older
        #   toolchains (QuadParsers on v4.27, VeIR on v4.32) pin an earlier
        #   srtfp commit. Tests must never assert on core Float
        #   parsing/printing (Float.ofScientific changed in lean4#14110),
        #   only on srtfp's own functions or hex bit patterns.
        toolchain:
          - leanprover/lean4:v4.33.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Select toolchain
        run: echo "${{ matrix.toolchain }}" > lean-toolchain

      - name: Cache toolchain and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: lake-${{ matrix.toolchain }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ matrix.toolchain }}-${{ hashFiles('lakefile.lean', 'lake-manifest.json') }}-

      # Fast source-level guard: the default umbrella must not import the
      # Float tier.
      - name: Axiom-tier import walk
        run: python3 tools/check_axiom_free_imports.py

      # Srtfp is the axiom-free reference tier, SrtfpPerf the opt-in
      # fast-path tier, SrtfpBridge the Float tier. SrtfpBitsAxiomCheck
      # fails the build if anything reachable from `import Srtfp` or
      # `import Srtfp.Perf` needs an axiom beyond propext / Quot.sound /
      # Classical.choice; SrtfpAxiomCheck audits the full Bridge closure
      # against the same budget.
      - name: Build
        run: lake build Srtfp SrtfpPerf SrtfpBridge SrtfpBitsAxiomCheck SrtfpAxiomCheck

      - name: Test
        run: lake test

