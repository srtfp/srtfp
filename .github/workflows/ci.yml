name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Fast source-level guard: the default umbrella must not import the
      # runtime-axiom tier.
      - name: Axiom-tier import walk
        run: python3 tools/check_axiom_free_imports.py

      # Srtfp is the axiom-free tier, SrtfpBridge the Float tier.
      # SrtfpBitsAxiomCheck fails the build if anything reachable from
      # `import Srtfp` needs an axiom beyond propext / Quot.sound /
      # Classical.choice; SrtfpAxiomCheck audits the full Bridge closure
      # against that budget plus the single runtime axiom
      # Float.toBits_ofBits.
      - name: Build
        run: lake build Srtfp SrtfpBridge SrtfpBitsAxiomCheck SrtfpAxiomCheck

      - name: Test
        run: lake test
